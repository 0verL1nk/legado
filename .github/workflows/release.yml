name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.MY_KEYSTORE_B64 }}" ]; then
            echo "::error::MY_KEYSTORE_B64 secret is required"
            exit 1
          fi
          echo "${{ secrets.MY_KEYSTORE_B64 }}" | base64 --decode > $GITHUB_WORKSPACE/app/release.jks
          echo "RELEASE_STORE_FILE=./release.jks" >> $GITHUB_WORKSPACE/gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.MY_KEY_ALIAS }}" >> $GITHUB_WORKSPACE/gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.MY_KEY_PASSWORD }}" >> $GITHUB_WORKSPACE/gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.MY_STORE_PASSWORD }}" >> $GITHUB_WORKSPACE/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleApprelease --build-cache --parallel --daemon

      - name: Organize the Files
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          cp -rf ${{ github.workspace }}/app/build/outputs/apk/*/*/*.apk ${{ github.workspace }}/apk/

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-release
          path: ${{ github.workspace }}/apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: legado_${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          body_path: ${{ github.workspace }}/CHANGELOG.md
          draft: false
          prerelease: false
          files: ${{ github.workspace }}/apk/legado_app_*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
